name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    env:
      GITHUB_SHA_FULL: ${{ github.sha }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # Strip leading "v" from tag (v0.1.0 -> 0.1.0)
          VERSION="${TAG_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Tag name is empty after stripping 'v' prefix" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: dotnet test tests/AutolumoBarcodeScannerTool.Tests/AutolumoBarcodeScannerTool.Tests.csproj -c Release --verbosity normal

      - name: Publish single-file self-contained
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION

      - name: Package as zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $publish = "src/AutolumoBarcodeScannerTool/bin/Release/net10.0-windows/win-x64/publish"
          $zip = "AutolumoBarcodeScannerTool-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "$publish/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA_FULL:0:7}"
          ZIP="AutolumoBarcodeScannerTool-${VERSION}-win-x64.zip"
          gh release create "$TAG_NAME" \
            --title "AutolumoBarcodeScannerTool v${VERSION}" \
            --notes "Build automático desde tag \`${TAG_NAME}\` (commit \`${SHORT_SHA}\`). Binario Windows x64 self-contained." \
            "$ZIP"
