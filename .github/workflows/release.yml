name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    env:
      GITHUB_SHA_FULL: ${{ github.sha }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # Strip leading "v" from tag (v0.1.0 -> 0.1.0)
          VERSION="${TAG_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Tag name is empty after stripping 'v' prefix" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: dotnet test tests/AutolumoBarcodeScannerTool.Tests/AutolumoBarcodeScannerTool.Tests.csproj -c Release --verbosity normal

      - name: Publish single-file self-contained
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish/selfcontained

      - name: Publish framework-dependent (requires .NET Desktop Runtime in target machine)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish/fxdependent

      - name: Package both as zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $sc  = "AutolumoBarcodeScannerTool-$env:VERSION-win-x64.zip"
          $fxd = "AutolumoBarcodeScannerTool-$env:VERSION-win-x64-fxdep.zip"
          Compress-Archive -Path "publish/selfcontained/*" -DestinationPath $sc  -Force
          Compress-Archive -Path "publish/fxdependent/*"   -DestinationPath $fxd -Force
          Write-Host "Created $sc and $fxd"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA_FULL:0:7}"
          ZIP_SC="AutolumoBarcodeScannerTool-${VERSION}-win-x64.zip"
          ZIP_FXD="AutolumoBarcodeScannerTool-${VERSION}-win-x64-fxdep.zip"
          NOTES=$'Build automatico desde tag `'"${TAG_NAME}"$'` (commit `'"${SHORT_SHA}"$'`).\n\n**Dos artifacts:**\n- `'"${ZIP_SC}"$'` (self-contained, ~110 MB): no requiere instalar nada en la PC destino.\n- `'"${ZIP_FXD}"$'` (framework-dependent, ~5 MB): requiere .NET 10 Desktop Runtime x64 ya instalado en la PC destino.\n\nVer `docs/installation-and-validation.md` para instrucciones de cada caso.'
          gh release create "$TAG_NAME" \
            --title "AutolumoBarcodeScannerTool v${VERSION}" \
            --notes "$NOTES" \
            "$ZIP_SC" "$ZIP_FXD"
