name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    env:
      GITHUB_SHA_FULL: ${{ github.sha }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Tag name is empty after stripping 'v' prefix" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: dotnet test tests/AutolumoBarcodeScannerTool.Tests/AutolumoBarcodeScannerTool.Tests.csproj -c Release --verbosity normal

      # -p:SelfContained=false is the MSBuild property override; the CLI flag
      # --self-contained false does NOT override the csproj <SelfContained>true</>.
      - name: Publish single-file framework-dependent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish/fxdep

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "AutolumoBarcodeScannerTool-$env:VERSION-win-x64-fxdep.zip"
          Compress-Archive -Path "publish/fxdep/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA_FULL:0:7}"
          ZIP="AutolumoBarcodeScannerTool-${VERSION}-win-x64-fxdep.zip"
          NOTES=$'Build automatico desde tag `'"${TAG_NAME}"$'` (commit `'"${SHORT_SHA}"$'`).\n\n**Requiere .NET 10 Desktop Runtime x64 instalado en la PC destino:**\nhttps://dotnet.microsoft.com/download/dotnet/10.0/runtime (elegir "Desktop Runtime").\n\n## Instalacion\n\n1. Descarga `'"${ZIP}"$'` (~5 MB).\n2. Extrae en una carpeta persistente (ej. `C:\\Tools\\Autolumo`).\n3. Ejecuta `AutolumoBarcodeScannerTool.exe`.\n4. Click derecho en el icono de bandeja > Configurar...\n5. Selecciona tu lector HID, opcionalmente filtra por ventana objetivo.\n6. Reinicia la app.\n\nEl bloqueo de espacios del lector queda activo automaticamente cuando la ventana configurada esta al frente.'
          gh release create "$TAG_NAME" \
            --title "AutolumoBarcodeScannerTool v${VERSION}" \
            --notes "$NOTES" \
            "$ZIP"
