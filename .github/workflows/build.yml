name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Core + Tests
        run: |
          dotnet restore src/AutolumoBarcodeScannerTool.Core/AutolumoBarcodeScannerTool.Core.csproj
          dotnet restore tests/AutolumoBarcodeScannerTool.Tests/AutolumoBarcodeScannerTool.Tests.csproj
      - name: Test
        run: dotnet test tests/AutolumoBarcodeScannerTool.Tests/AutolumoBarcodeScannerTool.Tests.csproj -c Release --no-restore --verbosity normal

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: test
    env:
      GITHUB_SHA_FULL: ${{ github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compute CI version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA_FULL:0:7}"
          VERSION="0.1.0-ci.${RUN_NUMBER}.${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish single-file self-contained
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish/selfcontained
      - name: Publish framework-dependent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          dotnet publish src/AutolumoBarcodeScannerTool/AutolumoBarcodeScannerTool.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish/fxdependent
      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutolumoBarcodeScannerTool-${{ steps.version.outputs.version }}-selfcontained
          path: publish/selfcontained/
          retention-days: 14
          if-no-files-found: error
      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutolumoBarcodeScannerTool-${{ steps.version.outputs.version }}-fxdependent
          path: publish/fxdependent/
          retention-days: 14
          if-no-files-found: error
