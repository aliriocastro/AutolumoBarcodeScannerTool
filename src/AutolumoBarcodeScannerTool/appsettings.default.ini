; AutolumoBarcodeScannerTool - configuración por defecto
; Ubicación en runtime: %LOCALAPPDATA%\AutolumoBarcodeScannerTool\appsettings.ini

[Scanner]
Enabled=true
SourceType=Serial
Terminator=CrLf

[Scanner:Serial]
PortName=COM3
BaudRate=9600
DataBits=8
Parity=None
StopBits=One
Encoding=Ascii

[Scanner:HidKeyboard]
VendorId=0x0000
ProductId=0x0000

[Scanner:Target]
ProcessName=
WindowTitleContains=

[Scanner:Diagnostics]
; VerboseLogging=true ⇒ se loggea cada paso del pipeline a Information.
; Útil para verificar qué teclas captura el lector, qué ventana está activa,
; y por qué el SendInput se descarta o se suprime. Apagar en producción.
VerboseLogging=false

[Autostart]
Enabled=true

[Logging]
MinimumLevel=Information
LogPayload=true
