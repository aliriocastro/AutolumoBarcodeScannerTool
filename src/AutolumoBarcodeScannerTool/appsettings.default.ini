; AutolumoBarcodeScannerTool - configuración por defecto
; Ubicación en runtime: %LOCALAPPDATA%\AutolumoBarcodeScannerTool\appsettings.ini

[Scanner]
Enabled=true
SourceType=Serial
Terminator=CrLf

[Scanner:Serial]
PortName=COM3
BaudRate=9600
DataBits=8
Parity=None
StopBits=One
Encoding=Ascii

[Scanner:HidKeyboard]
VendorId=0x0000
ProductId=0x0000

[Scanner:Target]
ProcessName=
WindowTitleContains=

[Scanner:Output]
OnTerminator=Tab
OutputSuffix={TAB}

[Autostart]
Enabled=true

[Logging]
MinimumLevel=Information
LogPayload=true
